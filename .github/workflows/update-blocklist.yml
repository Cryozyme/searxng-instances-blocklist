name: Update SearXNG blocklist

on:
  schedule:
    # Runs daily at 06:00 UTC. Edit the cron expression to change the time.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can push the updated file back

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate blocklist
        run: python scripts/generate_blocklist.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add searx-blocklist.txt
          # Compare the STAGED diff, not the working-tree diff. A brand-new
          # file is untracked, so `git diff` (no --cached) sees nothing to
          # compare and reports "no changes" even though the file exists --
          # it never gets committed. Staging first fixes that.
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit."
          else
            git commit -m "Update SearXNG blocklist ($(date -u +'%Y-%m-%d'))"
            git push
          fi
